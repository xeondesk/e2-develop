; e2 PHP configuration (used by the Docker container)
; Loads the compatibility layer for every request so the historic PHP4-era
; code sees mysql_*, $HTTP_*_VARS, ereg(), etc.

auto_prepend_file = /var/www/html/e2-include/compat.php

error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /var/log/php_errors.log

memory_limit = 128M
upload_max_filesize = 8M
post_max_size = 8M
max_execution_time = 60

; Comment cookies back in if you want to debug them
session.use_cookies = 1

[mail function]
sendmail_path = /usr/sbin/sendmail -t -i